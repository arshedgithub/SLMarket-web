name: CodeQL

# Static security analysis of the TypeScript code (injection, unsafe
# redirects, leaked secrets in code paths, ...). Findings appear under
# Security -> Code scanning.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC: new queries catch old code too

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - public/vendor
              - node_modules
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

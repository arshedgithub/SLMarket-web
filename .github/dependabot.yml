version: 2
updates:
  # Weekly dependency updates as a few grouped PRs into dev (CI checks them;
  # they reach production with the next dev -> main release).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Framework majors are planned upgrades, not weekly bumps.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: next-auth
        update-types: ["version-update:semver-major"]
      # Tied to the Node runtime (.nvmrc 22): firebase 13 needs Node 24 and
      # @types/node should match the Node major the app runs on.
      - dependency-name: firebase
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Colombo
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
